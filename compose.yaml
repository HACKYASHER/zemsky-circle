name: zemsky-circle

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_ROOMS: ${MAX_ROOMS:-50}
      MAX_ROOMS_PER_IP: ${MAX_ROOMS_PER_IP:-3}
      ROOM_IDLE_HOURS: ${ROOM_IDLE_HOURS:-4}
    volumes:
      - game-data:/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-18300}:8080"
    volumes:
      - ./app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private
      - edge
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    profiles:
      - standalone
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in the installer}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private
      - edge
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  game-data:
  caddy-data:
  caddy-config:

networks:
  private:
    internal: true
  edge:
